<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연습은행 - 은행 앱 연습하기</title>
<!-- 오픈 소스: Pretendard 글꼴 (SIL OFL 1.1), canvas-confetti (ISC). 인터넷이 없어도 앱은 그대로 동작해요. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
:root{--pri:#16806a;--pri-d:#0f5f4f;--pri-l:#e3f4ef;--acc:#ffb703;--bg:#f3f5f4;--card:#fff;--tx:#1c2a27;--sub:#5d6b68;--err:#c62828;--line:#dfe5e3}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:18px}
body{font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#cfd8d5;color:var(--tx);line-height:1.5}
#app{max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.15)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.strip{background:#333;color:#fff;font-size:.72rem;text-align:center;padding:4px 8px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{flex:1;font-size:1.15rem;text-align:center}
.back,.icon,.back-sp{width:48px;height:48px;font-size:1.5rem;border-radius:12px;flex:none}
.back,.icon{background:var(--pri-l)}
.prog{display:flex;gap:6px;padding:10px 16px 0}
.prog span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog span.on{background:var(--pri)}
.mis{margin:10px 16px 0;padding:8px 12px;background:#fff6d6;border:2px solid var(--acc);border-radius:12px;font-size:.85rem;font-weight:700}
.guide{display:flex;gap:10px;align-items:flex-start;margin:14px 16px 0}
.guide .face{font-size:2.2rem;flex:none}
.guide p{background:var(--card);border-radius:4px 18px 18px 18px;padding:12px 14px;font-size:1.05rem;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.06)}
main{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.btn{display:block;width:100%;min-height:64px;border-radius:16px;background:var(--pri);color:#fff;font-size:1.2rem;font-weight:700;padding:10px 14px}
.btn:disabled{background:#b9c4c1;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--tx);border:2px solid var(--line)}
.btn.white{background:#fff;color:var(--pri-d);min-height:56px;font-size:1.05rem}
.btn.red{background:var(--err)}
.btn.sm{min-height:48px;font-size:.95rem}
body.hint-on .next:not(:disabled){animation:pulse 1.2s infinite;outline:4px solid var(--acc)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,183,3,.7)}50%{box-shadow:0 0 0 12px rgba(255,183,3,0)}}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.bal{background:var(--pri);color:#fff}
.bal .sm{font-size:.85rem;opacity:.9}
.bal .money{font-size:2.1rem;font-weight:800;margin:6px 0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;padding:14px 8px;min-height:104px;font-weight:700;font-size:1rem;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.tile b{display:block;font-size:2rem}
.hero{text-align:center;padding:24px 0}
.hero .big{font-size:4.5rem}
.hero h2{font-size:1.5rem;margin:6px 0}
.hero p{color:var(--sub)}
input[type=text]{width:100%;font:inherit;font-size:1.4rem;font-weight:700;padding:16px;border:3px solid var(--pri);border-radius:16px;text-align:center;background:#fff}
.err{color:var(--err);font-weight:700;text-align:center}
.tip{background:var(--pri-l);border-radius:14px;padding:12px;font-size:.92rem}
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;min-height:60px;font-weight:700}
.chk i{width:34px;height:34px;border-radius:50%;border:3px solid #b9c4c1;display:grid;place-items:center;font-style:normal;color:transparent;flex:none}
.chk.on{border-color:var(--pri);background:var(--pri-l)}
.chk.on i{background:var(--pri);border-color:var(--pri);color:#fff}
.cam{background:#222;border-radius:18px;height:190px;display:grid;place-items:center;color:#fff;text-align:center}
.idcard{background:linear-gradient(135deg,#e8f1ff,#fff);border:2px solid #9db4d6;border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center}
.idcard .ph{font-size:3rem;background:#d5e2f5;border-radius:10px;padding:6px 10px}
.amt{text-align:center;background:var(--card);border-radius:18px;padding:14px}
.amt .num{font-size:2.2rem;font-weight:800;color:var(--pri-d)}
.amt .kor{color:var(--sub);font-weight:700}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{background:var(--pri-l);color:var(--pri-d);border-radius:12px;min-height:50px;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:var(--card);border-radius:14px;min-height:62px;font-size:1.6rem;font-weight:700;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.pad button:active,.tile:active,.opt:active{background:var(--pri-l)}
.dots{display:flex;justify-content:center;gap:18px;padding:16px 0}
.dots span{width:28px;height:28px;border-radius:50%;border:3px solid var(--pri);background:#fff}
.dots span.on{background:var(--pri)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;min-height:72px;font-size:1.1rem;font-weight:700}
.opt .em{font-size:2rem;flex:none}
.opt small{display:block;color:var(--sub);font-weight:400;font-size:.82rem}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.opt:disabled{opacity:.5;cursor:not-allowed}
table.cf{width:100%;border-collapse:collapse;background:var(--card);border-radius:18px;overflow:hidden}
table.cf td{padding:14px;border-bottom:1px solid var(--line);font-size:1.05rem}
table.cf td:first-child{color:var(--sub);width:40%}
table.cf td:last-child{font-weight:800;text-align:right}
table.cf tr:last-child td{border-bottom:0}
.done{text-align:center;background:var(--card);border-radius:18px;padding:24px 14px}
.done .confetti{font-size:4rem;animation:pop .6s}
.done h2{font-size:1.5rem;color:var(--pri-d);margin:6px 0}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.hi{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px}
.hi small{color:var(--sub);display:block}
.hi .p{color:#1565c0;font-weight:800;white-space:nowrap}
.hi .m{color:var(--err);font-weight:800;white-space:nowrap}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;min-height:48px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
select{font:inherit;font-weight:700;padding:12px 8px;min-height:52px;border:2px solid var(--pri);border-radius:12px;background:#fff;color:var(--tx);flex:1;min-width:0}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#222;color:#fff;padding:14px 20px;border-radius:16px;font-weight:700;z-index:9;max-width:90%;text-align:center;animation:pop .4s}
.empty{text-align:center;color:var(--sub);padding:30px 0}
@media print{.strip,header,.guide,button{display:none!important}body{background:#fff}#app{max-width:none;box-shadow:none}.hi{break-inside:avoid;border-bottom:1px solid #ccc}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== 저장 =====
const KEY='practiceBank.v1';
const def=()=>({name:'',account:null,products:[],history:[],settings:{voice:true,hint:true},done:{},month:0,salary:null,autopays:[],jobs:null,contacts:null});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.settings)return Object.assign(def(),s)}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),V='home',F={},lastGuide='';
const app=document.getElementById('app');

// ===== 도우미 =====
const won=n=>Number(n).toLocaleString('ko-KR')+'원';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function kor(n){if(!n)return '영';const d=['','일','이','삼','사','오','육','칠','팔','구'],u=['','십','백','천'],b=['','만','억'];let out='',g=0;
  while(n>0){const part=n%10000;let s='';String(part).split('').reverse().forEach((c,i)=>{c=+c;if(c)s=((c===1&&i>0)?'':d[c])+u[i]+s});if(part)out=s+b[g]+out;n=Math.floor(n/10000);g++}return out}
function today(){const d=new Date();d.setMonth(d.getMonth()+S.month);return (d.getMonth()+1)+'월 '+d.getDate()+'일'}
function speak(t,force){if((!S.settings.voice&&!force)||!('speechSynthesis' in window)||!t)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,' '));u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),3500)}
const vnow=()=>{const d=new Date();d.setMonth(d.getMonth()+S.month);return d};
const ymOf=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const ymLabel=s=>{const p=s.split('-');return p[0]+'년 '+Number(p[1])+'월'};
const dLabel=t=>{const d=new Date(t);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일'};
function hist(kind,title,amt){S.history.unshift({d:today(),ts:vnow().getTime(),kind,title,amt,bal:S.account.balance})}
function migrate(){const n=vnow();S.history.forEach(x=>{if(x.ts)return;const m=/(\d+)월 (\d+)일/.exec(x.d||'');let d=new Date(n);
  if(m){d=new Date(n.getFullYear(),m[1]-1,Number(m[2]));if(d>n)d.setFullYear(d.getFullYear()-1)}x.ts=d.getTime()})}
const rnd=n=>String(Math.floor(Math.random()*10**n)).padStart(n,'0');
const digits=s=>String(s||'').replace(/\D/g,'');

// ===== 연습용 데이터 (모두 지어낸 이름과 은행) =====
const BANKS=['연습은행','하늘은행','바다은행','나무은행'];
const PEOPLE=[
 {nick:'엄마',name:'김영희',bank:'하늘은행',no:'302-145-678901',em:'👩'},
 {nick:'아빠',name:'박철수',bank:'나무은행',no:'123-4567-8901-23',em:'👨'},
 {nick:'친구 민수',name:'김민수',bank:'바다은행',no:'246813-57-902468',em:'🧑'},
 {nick:'선생님',name:'이수진',bank:'연습은행',no:'1004-5555-1234',em:'🧑‍🏫'},
 {nick:'분식집',name:'맛나분식',bank:'하늘은행',no:'377-888-123456',em:'🍜'}
];
const JOBS=[
 {job:'카페 도우미',em:'☕',amount:500000},
 {job:'도서관 정리 도우미',em:'📚',amount:800000},
 {job:'마트 정리 직원',em:'🛒',amount:1000000}
];
const jobs=()=>S.jobs&&S.jobs.length?S.jobs:JOBS;
const BILLS=[
 {name:'휴대폰 요금',em:'📱',amount:35000},
 {name:'교통카드 요금',em:'🚌',amount:20000},
 {name:'인터넷 요금',em:'🌐',amount:25000},
 {name:'음악 듣기 요금',em:'🎵',amount:10000}
];
const SUR=['김','이','박','최','정','강','조','윤','장','임'];
const GIV=['서연','민준','지우','하준','수아','도윤','예은','시우','지민','현우','다은','준서','채원','건우','소율','우진','하은','선우','유나','지호','서윤','태윤','가은','은우','나연'];
// 은행마다 계좌번호 모양이 달라요 (모두 지어낸 번호)
function acctNo(bank,seed){let x=seed*7919,d='';while(d.length<14){x=x*48271%2147483647;d+=String(x%10)}d=d.replace(/^0/,'1');
  return bank==='연습은행'?'1004-'+d.slice(0,4)+'-'+d.slice(4,8)
   :bank==='하늘은행'?'3'+d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5,11)
   :bank==='바다은행'?d.slice(0,6)+'-'+d.slice(6,8)+'-'+d.slice(8,14)
   :d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7,11)+'-'+d.slice(11,13)}
const ACCTS=Array.from({length:50},(_,i)=>{const name=SUR[i%10]+GIV[i%25];return{nick:name,name,bank:BANKS[i%4],no:acctNo(BANKS[i%4],i+1),em:'👤'}});
const people=()=>PEOPLE.map((p,i)=>S.contacts&&S.contacts[i]?Object.assign({},p,S.contacts[i]):p);
const all=()=>people().concat(ACCTS);
const SAV_RATE=0.03,DP_RATE=0.025;
const MISSIONS=[
 {id:'m1',go:'open1',t:'내 계좌 만들기',test:e=>e.type==='open'},
 {id:'m2',go:'dep1',t:'내 통장에 10,000원 넣기',test:e=>e.type==='deposit'&&e.amount===10000},
 {id:'m3',go:'send1',get t(){return people()[0].nick+'에게 5,000원 이체하기'},test:e=>e.type==='send'&&e.no===PEOPLE[0].no&&e.amount===5000},
 {id:'m4',go:'send1',get t(){const p=people()[2];return `계좌번호를 직접 써서 ${p.name}(${p.bank} ${p.no})에게 3,000원 이체하기`},test:e=>e.type==='send'&&e.no===PEOPLE[2].no&&e.amount===3000&&e.direct},
 {id:'m5',go:'hist',t:'거래 내역 확인하기',test:e=>e.type==='hist'},
 {id:'m6',go:'sav0',t:'매달 10,000원씩 6개월 적금 만들기',test:e=>e.type==='saving'&&e.amount===10000&&e.months===6},
 {id:'m7',go:'dp0',t:'30,000원을 12개월 예금에 맡기기',test:e=>e.type==='fixed'&&e.amount===30000&&e.months===12},
 {id:'m8',go:'quiz',t:'안전 퀴즈 모두 맞히기',test:e=>e.type==='quiz'},
 {id:'m9',go:'sal0',t:'일터를 골라서 월급 받을 준비하기',test:e=>e.type==='salarySet'},
 {id:'m10',go:'ap0',t:'휴대폰 요금 자동납부 신청하기',test:e=>e.type==='autopay'&&e.name==='휴대폰 요금'},
 {id:'m11',go:'month',t:'한 달 뒤로 가서 월급이 들어오고 휴대폰 요금이 나가는 것 확인하기',test:e=>e.type==='month'&&e.salary&&e.paid>0}
];
const QUIZ=[
 {q:'모르는 사람이 전화로 "통장 비밀번호를 알려 주세요"라고 해요. 어떻게 할까요?',a:['비밀번호를 알려 준다','알려 주지 않고 전화를 끊는다'],ok:1,why:'비밀번호는 누구에게도 알려 주지 않아요. 은행 직원도 물어보지 않아요.'},
 {q:'문자가 왔어요. "선물 당첨! 먼저 돈을 보내 주세요." 어떻게 할까요?',a:['돈을 보내지 않고 어른에게 말한다','빨리 돈을 보낸다'],ok:0,why:'먼저 돈을 보내라는 문자는 거짓말(사기)이에요. 믿을 수 있는 어른에게 말해요.'},
 {q:'돈을 보내기 전에 꼭 확인할 것은 무엇일까요?',a:['확인하지 않아도 된다','받는 사람 이름과 보내는 돈'],ok:1,why:'잘못 보낸 돈은 돌려받기 어려워요. 이름과 돈을 꼭 확인해요.'},
 {q:'아는 형이 "네 통장이랑 카드를 빌려주면 돈을 줄게"라고 해요. 어떻게 할까요?',a:['빌려주지 않는다','빌려준다'],ok:0,why:'내 통장과 카드는 절대 빌려주지 않아요. 빌려주면 나도 벌을 받을 수 있어요.'}
];
const nextMission=()=>MISSIONS.find(m=>!S.done[m.id]);
function emit(ev){MISSIONS.forEach(m=>{if(!S.done[m.id]&&m===nextMission()&&m.test(ev)){S.done[m.id]=true;toast('⭐ 미션 성공! '+m.t)}});save()}

// ===== 화면 틀 =====
function page(c){
  const m=S.account&&!['home','missions','settings'].includes(V)?nextMission():null;
  return `<div class="strip">연습용 화면이에요 · 진짜 돈이 아니에요</div>
  <header>${c.back?`<button class="back" data-act="go" data-to="${c.back}" aria-label="뒤로 가기">←</button>`:'<span class="back-sp"></span>'}
  <h1>${c.title}</h1><button class="icon" data-act="speak" aria-label="다시 듣기">🔊</button></header>
  ${c.total?`<div class="prog">${Array.from({length:c.total},(_,i)=>`<span class="${i<c.step?'on':''}"></span>`).join('')}</div>`:''}
  ${m?`<div class="mis">⭐ 미션: ${m.t}</div>`:''}
  ${c.guide?`<div class="guide"><div class="face">🐻</div><p>${c.guide}</p></div>`:''}
  <main>${c.body}</main>`}
function render(sp=true){const c=SC[V]();document.body.classList.toggle('hint-on',!!S.settings.hint);app.innerHTML=page(c);lastGuide=c.guide||c.title;if(sp)speak(lastGuide)}
function go(to,sp=true){V=to;render(sp);window.scrollTo(0,0);if(to==='hist')emit({type:'hist'});
  if(window.confetti&&app.querySelector('.done'))try{confetti({particleCount:120,spread:80,origin:{y:.45},disableForReducedMotion:true})}catch(e){}}

function amountUI(err){const a=F.amount||0;return `<div class="amt"><div class="num">${won(a)}</div><div class="kor">${a?kor(a)+' 원':'숫자를 눌러요'}</div></div>
 ${err?`<p class="err">${err}</p>`:''}
 <div class="quick">${[1000,5000,10000,50000].map(v=>`<button data-act="add" data-v="${v}">+ ${won(v)}</button>`).join('')}</div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9,'00',0,'←'].map(k=>`<button data-act="key" data-k="${k}">${k}</button>`).join('')}</div>
 <button class="btn ghost sm" data-act="clear">모두 지우기</button>`}
function pinUI(){const p=F.pin||'';return `<div class="dots">${[0,1,2,3].map(i=>`<span class="${i<p.length?'on':''}"></span>`).join('')}</div>
 ${F.pinMsg?`<p class="err">${F.pinMsg}</p>`:''}
 <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'←'].map(k=>k===''?'<span></span>':`<button data-act="pin" data-k="${k}">${k}</button>`).join('')}</div>
 ${(F.pinFail||0)>=3?`<button class="btn ghost sm" data-act="showpin">비밀번호가 생각나지 않아요</button>`:''}`}
const rows=r=>`<table class="cf">${r.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>`;
const doneUI=(big,lines)=>`<div class="done"><div class="confetti">🎉</div><h2>${big}</h2>${lines.map(l=>`<p>${l}</p>`).join('')}</div><button class="btn next" data-act="start" data-to="home">처음 화면으로</button>`;
const nextBtn=(to,label='다음',dis=false)=>`<button class="btn next" data-act="go" data-to="${to}" ${dis?'disabled':''}>${label}</button>`;
const opt=(f,v,to,em,label,small='',dis=false)=>`<button class="opt ${F[f]===v?'sel':''}" data-act="pick" data-f="${f}" data-v="${v}" data-to="${to}" ${dis?'disabled':''}><span class="em">${em}</span><span>${label}${small?`<small>${small}</small>`:''}</span></button>`;
const savInterest=(a,n)=>Math.floor(a*SAV_RATE/12*n*(n+1)/2);
const dpInterest=(a,n)=>Math.floor(a*DP_RATE*n/12);

// ===== 화면들 =====
const SC={};
SC.home=()=>{
  if(!S.account)return{title:'연습은행',guide:'안녕하세요! 먼저 내 계좌를 만들어 볼까요? 노란색으로 반짝이는 단추를 눌러요.',
    body:`<div class="hero"><div class="big">🏦</div><h2>은행 앱 연습하기</h2><p>계좌 만들기, 돈 넣기, 이체하기,<br>적금과 예금을 연습해요.</p></div>

  return{title:'연습은행',guide:m?`미션이에요. ${m.t}`:'미션을 모두 끝냈어요! 하고 싶은 연습을 골라요.',
    body:`<div class="card bal"><div class="sm">${esc(S.name)} 님의 연습통장</div><div class="sm">연습은행 ${S.account.no}</div>
    <div class="money">${won(S.account.balance)}</div>
    <div class="row2"><button class="btn white ${hl('dep1')}" data-act="start" data-to="dep1">💰 돈 넣기</button><button class="btn white ${hl('send1')}" data-act="start" data-to="send1">📤 이체하기</button></div></div>
    <div class="grid">${tile('sav0','🐷','적금 만들기')}${tile('dp0','🔒','예금 만들기')}${tile('sal0','💼','월급 받기')}${tile('ap0','📱','자동납부')}${tile('month','⏩','한 달 뒤로 가기')}${tile('hist','📒','거래 내역')}${tile('prods','📂','내 적금·예금')}${tile('missions','⭐','미션 보기')}${tile('quiz','🛡️','안전 퀴즈')}</div>
    <button class="btn ghost sm" data-act="start" data-to="settings">⚙️ 설정 (선생님)</button>
    <button class="btn ghost sm" data-act="resetAsk">🔄 초기화 (처음부터 다시)</button>`}};

// --- 계좌 만들기 ---
SC.open1=()=>({title:'계좌 만들기',back:'home',step:1,total:5,guide:'이름을 써요. 다 쓰면 다음을 눌러요.',
  body:`<input type="text" data-f="name" maxlength="10" placeholder="내 이름" value="${esc(F.name||'')}" autocomplete="off">

SC.open2=()=>{const all=F.t1&&F.t2&&F.t3;const ck=(f,l)=>`<button class="chk ${F[f]?'on':''}" data-act="tog" data-f="${f}"><i>✓</i>${l}</button>`;

  ${nextBtn('open3','다음',!all)}`}};
SC.open3=()=>({title:'신분증 확인',back:'open2',step:3,total:5,guide:F.idShot?'신분증 사진이 찍혔어요. 이름이 맞으면 다음을 눌러요.':'은행은 내가 누구인지 확인해요. 신분증 사진 찍기를 눌러요.',
  body:F.idShot?`<div class="idcard"><div class="ph">🙂</div><div><small>연습용 신분증</small><br><b style="font-size:1.4rem">${esc(F.name)}</b><br><small>진짜 신분증이 아니에요</small></div></div>${nextBtn('open4')}`
  :`<div class="cam"><div>📷<br>네모 안에 신분증을 맞춰요<br><small>(연습이라 진짜로 찍지 않아요)</small></div></div><button class="btn next" data-act="shot">신분증 사진 찍기</button>`});
SC.open4=()=>({title:'비밀번호 만들기',back:'open3',step:4,total:5,guide:'비밀번호 숫자 4개를 눌러요. 나만 아는 숫자로 해요.',
  body:pinUI()+`<p class="tip">💡 1234처럼 쉬운 숫자는 안 돼요. 비밀번호는 아무에게도 알려 주지 않아요.</p>`});
SC.open5=()=>({title:'비밀번호 한 번 더',back:'open4',step:5,total:5,guide:'똑같은 비밀번호를 한 번 더 눌러요.',body:pinUI()});
SC.open6=()=>({title:'계좌 완성',guide:`축하해요! ${esc(S.name)} 님의 계좌가 만들어졌어요.`,

  return{title:'돈 넣기',back:'home',step:1,total:3,guide:'통장에 넣을 돈을 눌러요.',body:amountUI(err)+nextBtn('dep2','다음',!a||!!err)}};
SC.dep2=()=>({title:'돈 넣기 확인',back:'dep1',step:2,total:3,guide:`내 통장에 ${won(F.amount)}을 넣을까요? 맞으면 넣기를 눌러요.`,
  body:rows([['넣는 곳','내 연습통장'],['넣는 돈',won(F.amount)],['넣은 뒤 내 돈',won(S.account.balance+F.amount)]])+`<button class="btn next" data-act="doDeposit">넣기</button><button class="btn ghost" data-act="go" data-to="dep1">고치기</button>`});

  body:doneUI('돈을 넣었어요!',[`넣은 돈 <b>${won(F.amount)}</b>`,`지금 내 돈 <b>${won(S.account.balance)}</b>`])});

SC.send1=()=>({title:'누구에게 이체할까요?',back:'home',step:1,total:5,guide:'이체는 내 통장의 돈을 다른 사람 통장으로 보내는 것이에요. 돈을 받을 사람을 골라요. 모르는 사람에게는 이체하지 않아요.',
  body:people().map((p,i)=>`<button class="opt" data-act="toPerson" data-i="${i}"><span class="em">${p.em}</span><span>${p.nick}<small>${p.name} · ${p.bank} ${p.no}</small></span></button>`).join('')
  +`<button class="btn ghost" data-act="directStart">⌨️ 계좌번호 직접 쓰기</button><button class="btn ghost sm" data-act="editPeople" data-rb="send1">✏️ 받는 사람 이름 고치기</button>`});
SC.send1b=()=>{const sm=all()[F.sample];return{title:'계좌번호 쓰기',back:'send1',step:1,total:5,guide:F.found?`받는 사람은 ${F.to.name} 님이에요. 맞으면 다음을 눌러요.`:'연습 쪽지에 있는 은행을 고르고, 계좌번호 숫자를 써요. 그리고 찾기를 눌러요.',
  body:(!F.found&&sm?`<div class="mis" style="margin:0;text-align:center">📝 연습 쪽지 (이 계좌를 보고 써요)<br><span style="font-size:1.3rem">${sm.bank} ${sm.no}</span><br>받는 사람: ${sm.name}
   <div class="row2" style="margin-top:8px"><button class="btn white sm" data-act="shuffle">🔀 다른 계좌</button><button class="btn white sm" data-act="go" data-to="accts">📋 계좌 목록</button></div></div>`:'')
  +`<b>① 은행 고르기</b><div class="grid">${BANKS.map(b=>`<button class="opt ${F.bank===b?'sel':''}" data-act="pick" data-f="bank" data-v="${b}" data-to="">🏦 ${b}</button>`).join('')}</div>
  <b>② 계좌번호 쓰기</b> <small>( - 는 안 써도 돼요)</small><input type="text" data-f="accno" inputmode="numeric" maxlength="20" placeholder="계좌번호 숫자" style="font-size:1.25rem" value="${esc(F.accno||'')}" autocomplete="off">
  ${F.err?`<p class="err">${F.err}</p>`:''}
  ${F.found?`<div class="card" style="text-align:center">받는 사람<br><b style="font-size:1.5rem">${F.to.name} 님</b><br><small>${F.to.bank} ${F.to.no}</small></div>${nextBtn('send2','맞아요, 다음')}<button class="btn ghost sm" data-act="unfind">다시 쓰기</button>`
  :`<button class="btn next" data-act="lookup">③ 찾기</button>`}`}};
SC.accts=()=>{const pick=F.sample!=null;return{title:'연습용 계좌 목록',back:pick?'send1b':'settings',guide:pick?'연습할 계좌를 하나 골라요. 고른 계좌가 연습 쪽지에 나와요.':'',
  body:`<p class="tip">모두 지어낸 연습용 계좌예요. 진짜 계좌가 아니에요. (모두 ${all().length}개)</p>`+(pick?'':`<button class="btn ghost sm" data-act="print">🖨️ 목록 인쇄하기</button>`)
  +BANKS.map(b=>`<h3 style="margin-top:6px">🏦 ${b}</h3>`+all().map((p,i)=>p.bank!==b?'':pick?`<button class="opt" data-act="sample" data-i="${i}"><span class="em">${p.em}</span><span>${p.no}<small>${p.name}</small></span></button>`:`<div class="hi"><div>${p.no}<small>${b} · ${p.name}</small></div><div>${p.em}</div></div>`).join('')).join('')}};
SC.send2=()=>{const a=F.amount||0,err=a>S.account.balance?`내 돈이 부족해요. 지금 내 돈은 ${won(S.account.balance)}이에요.`:'';
  return{title:'얼마를 이체할까요?',back:'send1',step:2,total:5,guide:`${F.to.name} 님에게 이체할 돈을 눌러요.`,
  body:`<p class="tip">받는 사람: <b>${F.to.name}</b> (${F.to.bank}) · 내 돈: <b>${won(S.account.balance)}</b></p>`+amountUI(err)+nextBtn('send3','다음',!a||!!err)}};
SC.send3=()=>({title:'이체하기 전에 확인',back:'send2',step:3,total:5,guide:`${F.to.name} 님에게 ${won(F.amount)}을 이체해요. 이름과 돈이 맞는지 꼭 확인해요.`,
  body:rows([['받는 사람',F.to.name+' 님'],['은행',F.to.bank],['계좌번호',F.to.no],['이체하는 돈',won(F.amount)]])
  +`<p class="tip">⚠️ 잘못 이체한 돈은 돌려받기 어려워요.</p>${nextBtn('send4','맞아요, 이체하기')}<button class="btn ghost" data-act="go" data-to="send1">아니에요, 다시 하기</button>`});
SC.send4=()=>({title:'비밀번호',back:'send3',step:4,total:5,guide:'내 비밀번호 숫자 4개를 눌러요.',body:pinUI()});
SC.send5=()=>({title:'이체 끝',guide:`${F.to.name} 님에게 ${won(F.amount)}을 이체했어요.`,

SC.sav0=()=>({title:'적금이 뭐예요?',back:'home',guide:'적금은 매달 조금씩 돈을 모으는 통장이에요. 끝까지 모으면 은행이 이자를 더 줘요.',
  body:`<div class="card" style="text-align:center;font-size:1.1rem">🐷<br>매달 <b>조금씩</b> 넣어요<br>⬇️<br>약속한 날(만기)까지 기다려요<br>⬇️<br>모은 돈 + <b>이자</b>를 받아요</div>
  <p class="tip">지금 내 돈: <b>${won(S.account.balance)}</b> · 연습 이자: 1년에 ${SAV_RATE*100}%</p>${nextBtn('sav1','적금 만들기 시작')}`});

  +`<button class="opt" data-act="start2" data-to="sav1c"><span class="em">✏️</span><span>직접 쓰기<small>모을 돈을 숫자로 직접 눌러요</small></span></button>`
  +(b<10000?`<button class="btn next" data-act="start" data-to="dep1">💰 돈 넣으러 가기</button>`:'')}};
SC.sav1c=()=>{const a=F.amount||0,b=S.account.balance;const err=a>b?`내 돈이 부족해요. 지금 내 돈은 ${won(b)}이에요.`:(a>0&&a<1000?'1,000원부터 모을 수 있어요.':'');
  return{title:'매달 얼마씩? (직접 쓰기)',back:'sav1',step:1,total:5,guide:'매달 모을 돈을 숫자로 눌러요. 오늘 첫 번째 돈이 통장에서 나가요.',
  body:`<p class="tip">내 돈: <b>${won(b)}</b> · 1,000원부터 모을 수 있어요.</p>`+amountUI(err)+nextBtn('sav2','다음',!a||!!err)}};
const perLabel=n=>n<12?n+'개월':n%12?`${n}개월 (${Math.floor(n/12)}년 ${n%12}개월)`:`${n}개월 (${n/12}년)`;
SC.sav2=()=>({title:'몇 달 동안?',back:'sav1',step:2,total:5,guide:'몇 달 동안 모을지 골라요. 1개월부터 3년까지 할 수 있어요.',
  body:[1,6,12,24,36].map(n=>opt('months',n,'sav3','📅',perLabel(n),`다 모으면 ${won(F.amount*n)} + 이자 ${won(savInterest(F.amount,n))}`)).join('')
  +`<button class="opt" data-act="go" data-to="sav2c"><span class="em">✏️</span><span>직접 쓰기<small>1개월부터 36개월(3년)까지 숫자로 눌러요</small></span></button>`});

  <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'←'].map(k=>k===''?'<span></span>':`<button data-act="mkey" data-k="${k}">${k}</button>`).join('')}</div>
  ${n&&!err?`<p class="tip">다 모으면 <b>${won(F.amount*n)}</b> + 이자 <b>${won(savInterest(F.amount,n))}</b></p>`:''}
  <button class="btn next" data-act="monSet" ${!n||err?'disabled':''}>다음</button>`}};
SC.sav3=()=>({title:'매달 며칠에?',back:'sav2',step:3,total:5,guide:'매달 며칠에 돈이 나갈지 골라요. 그날 통장에서 저절로 나가요.',

SC.sav5=()=>({title:'비밀번호',back:'sav4',step:5,total:5,guide:'내 비밀번호 숫자 4개를 눌러요.',body:pinUI()});

// --- 내역 / 상품 ---
SC.hist=()=>{const hp=String(F.hp||'1'),ht=F.ht||'all',now=vnow(),all=S.history;
  const first=new Date(all.length?Math.min(...all.map(x=>x.ts)):now.getTime()),end=ymOf(now),months=[];
  for(let c=new Date(first.getFullYear(),first.getMonth(),1);months.length<240;c.setMonth(c.getMonth()+1)){const k=ymOf(c);months.push(k);if(k>=end)break}
  let from=months.includes(F.hf)?F.hf:months[0],to=months.includes(F.hto)?F.hto:end;if(from>to)[from,to]=[to,from];
  const start=new Date(now);if(/^\d+$/.test(hp))start.setMonth(start.getMonth()-Number(hp));
  let list=all.filter(x=>hp==='all'?true:hp==='custom'?(ymOf(x.ts)>=from&&ymOf(x.ts)<=to):x.ts>start.getTime());
  const tin=list.filter(x=>x.amt>=0).reduce((s,x)=>s+x.amt,0),tout=list.filter(x=>x.amt<0).reduce((s,x)=>s-x.amt,0);
  if(ht==='in')list=list.filter(x=>x.amt>=0);if(ht==='out')list=list.filter(x=>x.amt<0);
  const range=hp==='all'?'처음부터 지금까지':hp==='custom'?(from===to?ymLabel(from):ymLabel(from)+' ~ '+ymLabel(to)):dLabel(start)+' ~ '+dLabel(now);
  const chip=(f,v,cur,label)=>`<button class="chip ${cur===v?'on':''}" data-act="pick" data-f="${f}" data-v="${v}" data-to="">${label}</button>`;
  const sel=(f,cur)=>`<select data-rf="${f}" aria-label="${f==='hf'?'시작하는 달':'끝나는 달'}">${months.map(k=>`<option value="${k}" ${k===cur?'selected':''}>${ymLabel(k)}</option>`).join('')}</select>`;
  return{title:'거래 내역',back:'home',guide:'기간을 고르면 그 동안 들어온 돈과 나간 돈을 볼 수 있어요. 파란색은 들어온 돈, 빨간색은 나간 돈이에요.',
  body:`<b>📅 기간</b><div class="chips">${[['1','1개월'],['3','3개월'],['6','6개월'],['12','1년'],['all','전체'],['custom','직접 정하기']].map(([v,l])=>chip('hp',v,hp,l)).join('')}</div>
  ${hp==='custom'?`<div style="display:flex;gap:8px;align-items:center">${sel('hf',from)}<b>~</b>${sel('hto',to)}</div>`:''}
  <b>🔎 종류</b><div class="chips">${[['all','모두'],['in','들어온 돈'],['out','나간 돈']].map(([v,l])=>chip('ht',v,ht,l)).join('')}</div>
  <div class="card"><small>${range}</small>
   <div style="display:flex;justify-content:space-between;margin-top:6px"><span>들어온 돈</span><b style="color:#1565c0">+ ${won(tin)}</b></div>
   <div style="display:flex;justify-content:space-between"><span>나간 돈</span><b style="color:var(--err)">- ${won(tout)}</b></div></div>`
  +(list.length?list.map(x=>`<div class="hi"><div>${x.title}<small>${dLabel(x.ts)} · ${x.kind} · 남은 돈 ${won(x.bal)}</small></div><div class="${x.amt>=0?'p':'m'}">${x.amt>=0?'+':'-'} ${won(Math.abs(x.amt))}</div></div>`).join('')
    :`<p class="empty">${all.length?'이 기간에는 거래가 없어요.<br>다른 기간을 골라 봐요.':'아직 거래가 없어요.'}</p>`)}};
SC.prods=()=>{const live=S.products.filter(p=>!p.end),old=S.products.filter(p=>p.end);
  return{title:'내 적금·예금',back:'home',guide:live.length?'내가 만든 적금과 예금이에요. 한 달 뒤로 가기를 누르면 시간이 지나가요.':'아직 만든 적금이나 예금이 없어요.',
  body:(F.msgs||[]).map(m=>`<p class="tip">${m}</p>`).join('')
  +live.map(p=>{const pct=Math.round(p.elapsed/p.months*100);return `<div class="card"><b>${p.type==='적금'?'🐷':'🔒'} ${p.type}</b> · ${p.type==='적금'?'매달 '+won(p.amount):won(p.amount)}
   <div class="bar"><i style="width:${pct}%"></i></div><small>${p.elapsed}개월 지남 / 모두 ${p.months}개월 · 모은 돈 ${won(p.type==='적금'?p.amount*p.paid:p.amount)}</small>
   <button class="btn ghost sm" style="margin-top:8px" data-act="closeAsk" data-id="${p.id}">그만두기 (해지)</button></div>`}).join('')
  +(live.length?`<button class="btn next" data-act="nextMonth">⏩ 한 달 뒤로 가기 (연습)</button>`:`<p class="empty">📂</p>`)
  +old.map(p=>`<div class="hi"><div>${p.type} ${won(p.amount)}<small>${p.end} · 받은 돈 ${won(p.paidOut)}</small></div><div>${p.end==='만기'?'🎉':'✋'}</div></div>`).join('')}};
SC.close1=()=>{const p=S.products.find(x=>x.id===F.closeId),back=p.type==='적금'?p.amount*p.paid:p.amount;
  return{title:'정말 그만둘까요?',back:'prods',guide:'약속한 날 전에 그만두면 이자를 받지 못해요. 그래도 그만둘까요?',
  body:rows([['종류',p.type],['돌려받는 돈',won(back)],['이자','0원 (못 받아요)']])+`<button class="btn ghost next" data-act="go" data-to="prods">아니요, 계속 모을래요</button><button class="btn red" data-act="doClose">네, 그만둘래요</button>`}};

SC.quiz=()=>{const i=F.q||0,q=QUIZ[i];return{title:'안전 퀴즈',back:'home',step:i+1,total:QUIZ.length,guide:q.q,
  body:q.a.map((a,k)=>`<button class="opt" data-act="ans" data-i="${k}"><span class="em">${k?'②':'①'}</span><span>${a}</span></button>`).join('')+(F.qMsg?`<p class="err">${F.qMsg}</p>`:'')}};
SC.quizOk=()=>{const q=QUIZ[F.q||0];return{title:'정답!',guide:'정답이에요! '+q.why,body:`<div class="done"><div class="confetti">⭕</div><h2>정답이에요!</h2><p>${q.why}</p></div><button class="btn next" data-act="quizNext">다음</button>`}};
SC.quizDone=()=>({title:'퀴즈 끝',guide:'퀴즈를 모두 맞혔어요! 안전 약속을 꼭 기억해요.',
  body:doneUI('모두 맞혔어요!',['🔑 비밀번호는 알려 주지 않아요','📵 모르는 사람에게 돈을 보내지 않아요','👀 보내기 전에 이름과 돈을 확인해요','🙅 통장과 카드는 빌려주지 않아요'])});
SC.settings=()=>({title:'설정 (선생님)',back:'home',guide:'',
  body:`<button class="chk ${S.settings.voice?'on':''}" data-act="set" data-f="voice"><i>✓</i>🔊 안내 말 읽어 주기</button>
  <button class="chk ${S.settings.hint?'on':''}" data-act="set" data-f="hint"><i>✓</i>✨ 누를 단추 반짝이기 (힌트)</button>
  ${S.account?`<button class="btn ghost sm" data-act="tog" data-f="showPin">${F.showPin?'비밀번호: '+S.account.pin:'학생 비밀번호 보기'}</button>`:''}
  <button class="btn ghost sm" data-act="editJobs">💼 일터 이름·월급 고치기</button>
  <button class="btn ghost sm" data-act="editPeople" data-rb="settings">👪 이체 받는 사람 이름 고치기</button>
  <button class="btn ghost sm" data-act="start" data-to="accts">📋 연습용 계좌 목록 (보기·인쇄)</button>
  <p class="tip">이 기기의 브라우저에만 저장돼요. 학생 한 명이 기기 한 대를 쓰거나, 학생이 바뀔 때 아래 단추로 처음부터 다시 시작하세요.<br>힌트를 끄면 스스로 하는 연습(평가)에 쓸 수 있어요.</p>
  <button class="btn ghost sm" data-act="resetMissions">미션만 처음부터 다시</button>
  <button class="btn red sm" data-act="go" data-to="reset1">🔄 초기화 (모두 지우고 처음부터 다시)</button>`});
const korAmt=(v,empty='월급을 숫자로 써요')=>{const n=Number(digits(v));return n?won(n)+' ('+kor(n)+' 원)':empty};
SC.jobsEdit=()=>({title:'일터 고치기 (선생님)',back:'settings',guide:'',
  body:`<p class="tip">학생이 "월급 받기"에서 고르는 일터의 이름과 월급을 바꿀 수 있어요. 실습처나 취업처 이름을 넣어 보세요.</p>`
  +F.draft.map((j,i)=>`<div class="card"><b>일터 ${i+1}</b>
   <input type="text" data-jf="job" data-i="${i}" maxlength="15" placeholder="일터 이름" value="${esc(j.job)}" autocomplete="off" style="margin:8px 0;font-size:1.15rem">
   <input type="text" data-jf="amount" data-i="${i}" inputmode="numeric" maxlength="9" placeholder="월급 (숫자만)" value="${esc(j.amount)}" autocomplete="off" style="font-size:1.15rem">
   <div class="kor" style="text-align:center;color:var(--sub);margin-top:6px">${korAmt(j.amount)}</div>
   ${F.draft.length>1?`<button class="btn ghost sm" style="margin-top:8px" data-act="jobDel" data-i="${i}">이 일터 지우기</button>`:''}</div>`).join('')

SC.pplEdit=()=>({title:'받는 사람 이름 고치기',back:F.rb||'settings',guide:'이체할 때 나오는 사람의 이름을 고칠 수 있어요. 다 고치면 저장을 눌러요.',
  body:`<p class="tip">부르는 이름(예: 엄마, 할머니, 친구 지호)과 통장 이름(예: 김영희)을 바꿀 수 있어요. 계좌번호는 연습용 그대로예요. 진짜 계좌번호는 쓰지 않아요.</p>`
  +F.draft.map((p,i)=>`<div class="card"><b>${p.em} 받는 사람 ${i+1}</b><br><small>${p.bank} ${p.no}</small><br>
   <small>부르는 이름</small><input type="text" data-jf="nick" data-i="${i}" maxlength="10" placeholder="예: 엄마" value="${esc(p.nick)}" autocomplete="off" style="margin:4px 0 10px;font-size:1.15rem">
   <small>통장 이름</small><input type="text" data-jf="name" data-i="${i}" maxlength="10" placeholder="예: 김영희" value="${esc(p.name)}" autocomplete="off" style="margin-top:4px;font-size:1.15rem"></div>`).join('')
  +(F.err?`<p class="err">${F.err}</p>`:'')
  +`<button class="btn next" data-act="pplSave">저장</button><button class="btn ghost sm" data-act="pplDefault">처음 이름으로 되돌리기</button>`});
SC.reset1=()=>{const b=F.rb||'settings';return{title:'초기화',back:b,guide:'초기화하면 계좌와 돈, 적금, 예금, 월급, 자동납부, 미션이 모두 지워져요. 정말 처음부터 다시 할까요?',
  body:`<div class="hero"><div class="big">🔄</div><p>지우면 되돌릴 수 없어요.</p></div>
  <button class="btn ghost next" data-act="go" data-to="${b}">아니요, 그대로 둘래요</button><button class="btn red" data-act="doReset">네, 처음부터 다시 해요</button>`}};

// ===== 동작 =====
function auth(p,ok){if(p===S.account.pin){F.pinFail=0;F.pinMsg='';ok()}else{F.pinFail=(F.pinFail||0)+1;F.pinMsg='비밀번호가 달라요. 다시 눌러 보세요.';render(false);speak(F.pinMsg)}}
function runMonth(){S.month++;const msgs=[];let paid=0;
  if(S.salary){S.account.balance+=S.salary.amount;hist('월급',S.salary.job+' 월급',S.salary.amount);msgs.push(`💼 월급 ${won(S.salary.amount)}이 들어왔어요!`)}
  S.autopays.forEach(a=>{
    if(S.account.balance>=a.amount){S.account.balance-=a.amount;paid++;hist('자동납부',a.name+' 자동납부',-a.amount);msgs.push(`${a.em} ${a.name} ${won(a.amount)}이 저절로 나갔어요.`)}
    else msgs.push(`⚠️ 내 돈이 부족해서 ${a.name} ${won(a.amount)}을 내지 못했어요. 요금이 밀리면 안 돼요. 통장에 돈을 넣어요.`)});
  S.products.filter(p=>!p.end).forEach(p=>{p.elapsed++;
    if(p.type==='적금'&&p.elapsed<p.months&&p.paid<p.months){
      if(S.account.balance>=p.amount){S.account.balance-=p.amount;p.paid++;hist('적금','적금 자동이체',-p.amount);msgs.push(`🐷 적금 ${won(p.amount)}이 저절로 나갔어요.`)}
      else msgs.push(`⚠️ 내 돈이 부족해서 이번 달 적금 ${won(p.amount)}을 넣지 못했어요.`)}
    if(p.elapsed>=p.months){const pr=p.type==='적금'?p.amount*p.paid:p.amount,it=p.type==='적금'?savInterest(p.amount,p.paid):dpInterest(p.amount,p.months);
      p.end='만기';p.paidOut=pr+it;S.account.balance+=pr+it;hist(p.type,p.type+' 만기 (이자 '+won(it)+')',pr+it);msgs.push(`🎉 ${p.type}이 끝났어요! ${won(pr)} + 이자 ${won(it)}을 받았어요.`)}});
  if(!msgs.length)msgs.push('한 달이 지났어요. 아무 일도 없었어요.');
  emit({type:'month',salary:!!S.salary,paid});return msgs}
const PIN_DONE={
 ap4:p=>auth(p,()=>{S.autopays.push({id:Date.now(),name:F.bill.name,em:F.bill.em,amount:F.bill.amount,day:F.day});emit({type:'autopay',name:F.bill.name});go('ap5')}),
 open4:p=>{if(/^(\d)\1{3}$/.test(p)||p==='1234'||p==='4321'){F.pinMsg='너무 쉬운 숫자예요. 다른 숫자로 해요.';render(false);speak(F.pinMsg)}else{F.newPin=p;F.pinMsg='';go('open5')}},
 open5:p=>{if(p!==F.newPin){F.pinMsg='처음 숫자와 달라요. 처음부터 다시 만들어요.';go('open4',false);speak(F.pinMsg)}
   else{S.name=F.name;S.account={no:'1004-'+rnd(4)+'-'+rnd(4),pin:p,balance:0};emit({type:'open'});go('open6')}},
 send4:p=>auth(p,()=>{S.account.balance-=F.amount;hist('이체',F.to.name+' 님에게 이체',-F.amount);emit({type:'send',no:F.to.no,nick:F.to.nick,name:F.to.name,amount:F.amount,direct:!!F.direct});go('send5')}),
 sav5:p=>auth(p,()=>{S.account.balance-=F.amount;S.products.push({id:Date.now(),type:'적금',amount:F.amount,months:F.months,day:F.day,paid:1,elapsed:0});hist('적금','적금 첫 번째 넣기',-F.amount);emit({type:'saving',amount:F.amount,months:F.months});go('sav6')}),
 dp4:p=>auth(p,()=>{S.account.balance-=F.amount;S.products.push({id:Date.now(),type:'예금',amount:F.amount,months:F.months,paid:1,elapsed:0});hist('예금','예금에 맡기기',-F.amount);emit({type:'fixed',amount:F.amount,months:F.months});go('dp5')})
};
const A={
 go:d=>go(d.to),
 start:d=>{F={};go(d.to)},
 start2:d=>{F={};go(d.to)},
 speak:()=>speak(lastGuide,true),
 key:d=>{let a=F.amount||0;a=d.k==='←'?Math.floor(a/10):Math.min(Number(String(a)+d.k),99999999);F.amount=a;render(false)},
 add:d=>{F.amount=Math.min((F.amount||0)+Number(d.v),99999999);render(false)},
 clear:()=>{F.amount=0;render(false)},
 pick:d=>{F[d.f]=/^\d+$/.test(d.v)?Number(d.v):d.v;if(d.f==='bank'){F.found=false;F.err=''}d.to?go(d.to):render(false)},
 tog:d=>{F[d.f]=!F[d.f];render(false)},
 togAll:()=>{const v=!(F.t1&&F.t2&&F.t3);F.t1=F.t2=F.t3=v;render(false)},
 nameNext:()=>{F.name=(F.name||'').trim();if(!F.name){F.err='이름을 써 주세요.';render(false);speak(F.err)}else{F.err='';go('open2')}},
 shot:()=>{F.idShot=true;render()},
 pin:d=>{let p=F.pin||'';p=d.k==='←'?p.slice(0,-1):p+d.k;F.pin=p;if(p.length<4){render(false);return}F.pin='';PIN_DONE[V](p)},
 showpin:()=>{F.pinMsg='내 비밀번호는 '+S.account.pin+' 이에요. (연습이라서 보여 줘요)';render(false)},
 doDeposit:()=>{S.account.balance+=F.amount;hist('넣기','내 통장에 돈 넣기',F.amount);emit({type:'deposit',amount:F.amount});go('dep3')},
 toPerson:d=>{F.to=people()[d.i];F.direct=false;F.amount=0;go('send2')},
 lookup:()=>{const no=digits(F.accno);if(!F.bank)F.err='은행을 먼저 골라요.';else if(!no)F.err='계좌번호 숫자를 써요.';
   else{const p=all().find(x=>x.bank===F.bank&&digits(x.no)===no);if(p){F.to=p;F.direct=true;F.found=true;F.err='';F.amount=0;render();return}
     F.err=all().some(x=>digits(x.no)===no)?`이 계좌번호는 ${F.bank}에 없어요. 은행을 다시 골라요.`:'없는 계좌예요. 숫자를 다시 확인해요.'}
   F.found=false;render(false);speak(F.err)},
 directStart:()=>{const m=nextMission();F={sample:m&&m.id==='m4'?2:Math.floor(Math.random()*all().length)};go('send1b')},
 shuffle:()=>{let i;do{i=Math.floor(Math.random()*all().length)}while(i===F.sample);F.sample=i;F.err='';render(false)},
 sample:d=>{F.sample=Number(d.i);F.found=false;F.accno='';F.bank='';F.err='';go('send1b')},
 print:()=>{try{window.print()}catch(e){}},
 unfind:()=>{F.found=false;F.accno='';render()},
 nextMonth:()=>{F.msgs=runMonth();if(V==='prods')render(false);else go('month',false);speak(F.msgs.join(' '))},
 editJobs:()=>{F={draft:jobs().map((j,i)=>({job:j.job,em:j.em,amount:String(j.amount),orig:i}))};go('jobsEdit')},
 jobAdd:()=>{F.draft.push({job:'',em:'💼',amount:'',orig:-1});F.err='';render(false)},
 jobDel:d=>{F.draft.splice(Number(d.i),1);F.err='';render(false)},
 jobDefault:()=>{S.jobs=null;toast('처음 값으로 되돌렸어요');A.editJobs()},
 jobSave:()=>{const nw=F.draft.map(j=>({job:String(j.job).replace(/[<>&"']/g,'').trim().slice(0,15),em:j.em||'💼',amount:Number(digits(j.amount))}));
   const bad=nw.findIndex(j=>!j.job||!j.amount);
   if(bad>=0){F.err=`일터 ${bad+1}: 이름과 월급(숫자)을 모두 써 주세요.`;render(false);return}
   if(new Set(nw.map(j=>j.job)).size<nw.length){F.err='같은 이름의 일터가 있어요. 이름을 다르게 써 주세요.';render(false);return}
   const cur=S.salary?jobs().findIndex(j=>j.job===S.salary.job):-1,k=cur>=0?F.draft.findIndex(j=>j.orig===cur):-1;
   S.jobs=nw;if(k>=0)S.salary=nw[k];toast('저장했어요');F={};go('settings')},
 customStart:()=>{F={cjob:S.salary?S.salary.job:'',camt:S.salary?String(S.salary.amount):''};go('sal1c')},
 customJob:()=>{const job=String(F.cjob||'').replace(/[<>&"']/g,'').trim().slice(0,15),amount=Number(digits(F.camt));
   if(!job)F.err='직장 이름을 써 주세요.';else if(!amount)F.err='월급을 숫자로 써 주세요.';else if(amount>99999999)F.err='월급이 너무 커요. 다시 써 주세요.';
   else{F.err='';F.job={job,em:(S.salary&&S.salary.job===job&&S.salary.em)||'💼',amount};go('sal2');return}
   render(false);speak(F.err)},
 mkey:d=>{let n=F.mon||0;n=d.k==='←'?Math.floor(n/10):Math.min(Number(String(n)+d.k),999);F.mon=n;render(false)},
 madd:d=>{F.mon=Math.max(0,Math.min(36,(F.mon||0)+Number(d.v)));render(false)},
 monSet:()=>{F.months=F.mon;go('sav3')},
 billStart:()=>{F={bname:'',bamt:''};go('ap1c')},
 customBill:()=>{const name=String(F.bname||'').replace(/[<>&"']/g,'').trim().slice(0,12),amount=Number(digits(F.bamt));
   if(!name)F.err='요금 이름을 써 주세요.';else if(S.autopays.some(a=>a.name===name))F.err='이미 신청한 요금이에요. 다른 이름을 써 주세요.';
   else if(!amount)F.err='내는 돈을 숫자로 써 주세요.';else if(amount>9999999)F.err='돈이 너무 커요. 다시 써 주세요.';
   else{F.err='';const b=BILLS.find(x=>x.name===name);F.bill={name,em:b?b.em:'🧾',amount};go('ap2');return}
   render(false);speak(F.err)},
 resetAsk:()=>{F={rb:'home'};go('reset1')},
 editPeople:d=>{F={rb:d.rb||F.rb||'settings',draft:people().map(p=>({em:p.em,bank:p.bank,no:p.no,nick:p.nick,name:p.name}))};go('pplEdit')},
 pplDefault:()=>{S.contacts=null;toast('처음 이름으로 되돌렸어요');A.editPeople({rb:F.rb})},
 pplSave:()=>{const cl=s=>String(s||'').replace(/[<>&"']/g,'').trim().slice(0,10),nw=F.draft.map(p=>({nick:cl(p.nick),name:cl(p.name)}));
   const bad=nw.findIndex(p=>!p.nick||!p.name);
   if(bad>=0){F.err=`받는 사람 ${bad+1}: 부르는 이름과 통장 이름을 모두 써 주세요.`;render(false);speak(F.err);return}
   if(new Set(nw.map(p=>p.nick)).size<nw.length){F.err='부르는 이름이 같은 사람이 있어요. 다르게 써 주세요.';render(false);speak(F.err);return}
   S.contacts=nw;toast('저장했어요');const rb=F.rb||'settings';F={};go(rb)},
 pickJob:d=>{F.job=jobs()[d.i];go('sal2')},
 doSalary:()=>{S.salary=F.job;emit({type:'salarySet'});go('sal3')},
 pickBill:d=>{F.bill=BILLS[d.i];go('ap2')},
 apStop:d=>{S.autopays=S.autopays.filter(a=>a.id!==Number(d.id));toast('자동납부를 그만뒀어요');render(false)},
 closeAsk:d=>{F.closeId=Number(d.id);go('close1')},
 doClose:()=>{const p=S.products.find(x=>x.id===F.closeId),back=p.type==='적금'?p.amount*p.paid:p.amount;p.end='해지';p.paidOut=back;S.account.balance+=back;hist(p.type,p.type+' 그만두기 (해지)',back);save();F={msgs:[`✋ ${p.type}을 그만두고 ${won(back)}을 돌려받았어요. 이자는 받지 못했어요.`]};go('prods')},
 ans:d=>{const q=QUIZ[F.q||0];if(Number(d.i)===q.ok){F.qMsg='';go('quizOk')}else{F.qMsg='다시 생각해 봐요. '+q.why;render(false);speak(F.qMsg)}},
 quizNext:()=>{F.q=(F.q||0)+1;if(F.q>=QUIZ.length){emit({type:'quiz'});go('quizDone')}else go('quiz')},
 set:d=>{S.settings[d.f]=!S.settings[d.f];save();render(false)},
 resetMissions:()=>{S.done={};if(S.account)S.done.m1=true;save();toast('미션을 처음부터 다시 해요');render(false)},
 doReset:()=>{const st=S.settings,jb=S.jobs;S=def();S.settings=st;S.jobs=jb;save();F={};go('home')}
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){f(b.dataset);save()}});
app.addEventListener('input',e=>{const f=e.target.dataset.f;if(f)F[f]=e.target.value;
  if(f==='camt'||f==='bamt'){const k=e.target.parentNode.querySelector('.kor');if(k)k.textContent=f==='bamt'?korAmt(e.target.value,'요금을 숫자로 써요'):korAmt(e.target.value)}
  const jf=e.target.dataset.jf;if(jf&&F.draft){F.draft[e.target.dataset.i][jf]=e.target.value;if(jf==='amount'){const k=e.target.parentNode.querySelector('.kor');if(k)k.textContent=korAmt(e.target.value)}}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.f==='accno'){e.preventDefault();F.accno=e.target.value;A.lookup();save()}});
app.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.rf;if(f){F[f]=e.target.value;render(false)}});
migrate();
render(false);
</script>
